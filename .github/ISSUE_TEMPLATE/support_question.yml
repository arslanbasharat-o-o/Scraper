name: Support question
description: Ask setup or usage questions
title: "[Question]: "
labels:
  - question
body:
  - type: dropdown
    id: project_area
    attributes:
      label: Question area
      options:
        - image-scraper
        - parts-extractor
        - repository / CI
        - not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do?
      placeholder: How should I run or configure the affected app for my use case?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include relevant config, logs, and environment info
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the root README and the relevant app README/docs first.
          required: true
