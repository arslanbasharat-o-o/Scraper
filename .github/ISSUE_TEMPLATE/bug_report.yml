name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please provide enough detail to reproduce the issue quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug
      placeholder: Automation job saves but never runs
    validations:
      required: true
  - type: dropdown
    id: project_area
    attributes:
      label: Affected area
      options:
        - image-scraper
        - parts-extractor
        - repository / CI
        - not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact sequence of actions, inputs, and URLs
      placeholder: |
        1. Start the affected app with `image-scraper/start.bat` or `parts-extractor/start.bat`
        2. Open the affected page or call the affected API route
        3. Use the exact URL / payload / action that triggers the issue
        4. Observe ...
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The action should complete successfully and return the expected UI or API result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The page errors, the request fails, or the job gets stuck
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste log lines, stack traces, or screenshots
      render: text
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Local (image-scraper)
        - Local (parts-extractor)
        - Docker
        - Railway
        - GitHub Actions
        - Other
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: v20.20.1
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: Python 3.12.8
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I confirmed this issue is not already reported.
          required: true
        - label: I tested with the latest `main` branch.
          required: true
