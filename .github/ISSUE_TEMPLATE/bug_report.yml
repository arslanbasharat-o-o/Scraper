name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the issue quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Automation run gets stuck during product detail scan
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Extractor
        - Automation
        - History
        - Menu Map
        - Authentication
        - Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app
        2. Open /automation
        3. Run the selected schedule
        4. Observe ...
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: text
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: Python 3.12.10
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested with the latest `main` branch.
          required: true
