name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: project_area
    attributes:
      label: Target area
      options:
        - image-scraper
        - parts-extractor
        - repository / CI
        - not sure
    validations:
      required: true
  - type: input
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: Operators cannot easily tell whether an action belongs in image-scraper or parts-extractor
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your preferred implementation
      placeholder: Add clearer project-level guidance, workflow automation, or product behavior improvements
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Manual steps, docs-only changes, or a smaller UI/API tweak
  - type: textarea
    id: scope
    attributes:
      label: Success criteria
      description: How do we know this feature is done?
      placeholder: |
        - Behavior is defined clearly
        - UI/API/docs are updated where needed
        - Validation steps are straightforward
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Expected impact
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I reviewed existing issues and discussions.
          required: true
        - label: I can help validate the solution once implemented.
          required: false
