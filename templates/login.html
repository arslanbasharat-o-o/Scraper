<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <script>
    (() => {
      try {
        const theme = sessionStorage.getItem('cy_theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - Parts Extractor v8.2.0</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap">
  <style>
    :root,
    [data-bs-theme="dark"] {
      --startup-bg: #0d0f14;
      --startup-text: #e8eaf5;
      --startup-card: #13161e;
      --startup-border: #252a3d;
    }

    [data-bs-theme="light"] {
      --startup-bg: #f2f4fb;
      --startup-text: #0e1230;
      --startup-card: #ffffff;
      --startup-border: #d0d5ee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-ui, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
      background: var(--startup-bg);
      color: var(--startup-text);
      min-height: 100vh;
    }

    .page-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: .75rem 1rem;
    }

    .cy-card {
      background: var(--startup-card);
      border: 1px solid var(--startup-border);
      border-radius: 16px;
    }

    .login-container {
      max-width: 440px;
      margin: 3rem auto;
      padding: 2rem;
    }

    .login-heading {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .login-heading h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .login-heading p {
      font-size: 0.8rem;
      color: var(--text-2);
      margin: 0;
    }

    .login-form .form-group {
      margin-bottom: 1.15rem;
    }

    .login-actions {
      margin-top: 1.5rem;
    }

    .login-actions .btn-run {
      width: 100%;
      justify-content: center;
      padding: 0.7rem;
      font-size: 0.9rem;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
    }

    .remember-wrap input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ asset_url('css/common.css') }}">
</head>

<body>
  <div class="page-shell py-3">

    <!-- ── Unified Header ───────────────────────────────────────── -->
    <header class="app-header cy-card mb-4">
      <div class="header-left">
        <div class="app-logo">PE</div>
        <div class="header-brand">
          <div class="header-title-row">
            <h1 class="app-title">Parts Extractor</h1>
            <span class="version-badge">v8.2.0</span>
          </div>
          <p class="app-sub">Multi-source product extraction</p>
        </div>
      </div>
      <div class="header-right">
        <div class="theme-switch" aria-label="Color theme">
          <span class="theme-label">Light</span>
          <label class="switch-track">
            <input type="checkbox" id="darkMode" aria-label="Toggle dark mode" checked>
            <span class="switch-thumb"></span>
          </label>
          <span class="theme-label">Dark</span>
        </div>
      </div>
    </header>

    <!-- ── Login Form Card ────────────────────────────────────── -->
    <main class="cy-card login-container">
      <div class="login-heading">
        <h2>Sign In</h2>
        <p>Enter your credentials to access the workspace</p>
      </div>

      {% if error %}
      <div class="alert-banner alert-danger mb-3" role="alert">
        <span style="font-weight:800;margin-right:.45rem">ERR</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form class="login-form" method="post" action="{{ url_for('auth_login') }}{% if next %}?next={{ next | urlencode }}{% endif %}" novalidate>
        <input type="hidden" name="next" value="{{ next | e }}" />

        <div class="form-group">
          <label class="field-label-sm" for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            class="field-input"
            autocomplete="username"
            placeholder="admin"
            autofocus
            required
          />
        </div>

        <div class="form-group">
          <label class="field-label-sm" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="field-input"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          />
        </div>

        <label class="remember-wrap">
          <input type="checkbox" id="remember" name="remember" value="1" />
          <span>Keep me signed in</span>
        </label>

        <div class="login-actions">
          <button type="submit" class="btn-run">
            <span>Sign In</span>
          </button>
        </div>
      </form>
    </main>

  </div>

  <script>
    // Theme toggle handling matching index.html
    const darkModeToggle = document.getElementById('darkMode');
    if (darkModeToggle) {
      const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'dark';
      darkModeToggle.checked = currentTheme === 'dark';
      darkModeToggle.addEventListener('change', () => {
        const theme = darkModeToggle.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.style.colorScheme = theme;
        try { sessionStorage.setItem('cy_theme', theme); } catch (_) {}
      });
    }
  </script>
</body>

</html>
