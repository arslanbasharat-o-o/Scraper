<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users & Roles - Parts Extractor</title>
  <link rel="icon" href="data:," />
  <script>
    (function () {
      const saved = sessionStorage.getItem('cy_theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ asset_url('css/common.css') }}">
  <style>
    body { font-family: var(--font-ui, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif); background: #0d0f14; color: #e8eaf5; min-height: 100vh; }
    [data-bs-theme="light"] body { background: #f2f4fb; color: #0e1230; }

    .page-shell { max-width: 1440px; margin: 0 auto; padding: .75rem 1rem; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.5rem; background: #13161e; border: 1px solid #252a3d; border-radius: 12px; margin-bottom: 1rem; }
    [data-bs-theme="light"] .app-header { background: #fff; border-color: #d0d5ee; }
    .users-header-left { display:flex; align-items:center; gap: 1rem; min-width: 0; }
    .users-header-actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; justify-content: flex-end; }

    .nav-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .nav-link { color: #818ba0; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 500; }
    .nav-link.active { background: #4f8cff; color: #fff; }
    .nav-link:hover:not(.active) { background: #252a3d; color: #e8eaf5; }
    [data-bs-theme="light"] .nav-link { color: #5c678a; }
    [data-bs-theme="light"] .nav-link:hover:not(.active) { background: #e3e7f6; color: #0e1230; }

    .users-table-card { background: #13161e; border: 1px solid #252a3d; border-radius: 12px; overflow: auto; margin-bottom: 2rem; }
    [data-bs-theme="light"] .users-table-card { background: #fff; border-color: #d0d5ee; }

    table.modern-table { width: 100%; border-collapse: collapse; text-align: left; }
    table.modern-table th, table.modern-table td { padding: 1rem; border-bottom: 1px solid #252a3d; }
    [data-bs-theme="light"] table.modern-table th, [data-bs-theme="light"] table.modern-table td { border-bottom-color: #e3e7f6; }
    table.modern-table th { font-weight: 600; color: #818ba0; }
    [data-bs-theme="light"] table.modern-table th { color: #5c678a; }

    .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85em; font-weight: 500; }
    .badge.admin { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge.operator { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .badge.viewer { background: rgba(107, 114, 128, 0.2); color: #d1d5db; }

    [data-bs-theme="light"] .badge.admin { background: #fee2e2; color: #991b1b; }
    [data-bs-theme="light"] .badge.operator { background: #e0e7ff; color: #3730a3; }
    [data-bs-theme="light"] .badge.viewer { background: #f3f4f6; color: #374151; }

    .user-auth-badge { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; background: rgba(255,255,255,0.06); padding: 0.35rem 0.65rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); white-space: nowrap; }
    .user-auth-badge a { color: #f87171; text-decoration: none; font-weight: 700; }
    .user-auth-badge a:hover { color: #fecaca; }
    [data-bs-theme="light"] .user-auth-badge { background: #f6f7fb; border-color: #d0d5ee; }
    [data-bs-theme="light"] .user-auth-badge a { color: #b91c1c; }
    .user-actions { display:flex; gap: .5rem; flex-wrap: wrap; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 50; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #13161e; padding: 2rem; border: 1px solid #252a3d; border-radius: 12px; width: 100%; max-width: 400px; }
    [data-bs-theme="light"] .modal-card { background: white; border-color: #d0d5ee; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    .form-control { width: 100%; padding: 0.5rem; border: 1px solid #252a3d; border-radius: 6px; background: #0d0f14; color: #e8eaf5; }
    [data-bs-theme="light"] .form-control { background: #fff; border-color: #ccc; color: #000; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    .btn-save { background: #4f8cff; color: white; padding: 0.5rem 1rem; border: none; border-radius: 6px; }
    .btn-cancel { background: transparent; color: inherit; border: 1px solid #252a3d; padding: 0.5rem 1rem; border-radius: 6px; }
    [data-bs-theme="light"] .btn-cancel { border-color: #ccc; }
    @media (max-width: 900px) {
      .app-header { align-items: flex-start; flex-direction: column; }
      .users-header-left { align-items: flex-start; flex-direction: column; }
      .users-header-actions { justify-content: flex-start; width: 100%; }
      table.modern-table th, table.modern-table td { padding: .75rem; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div class="users-header-left">
        <h4 style="margin:0; font-weight:700;">PE Admin</h4>
        <nav class="nav-pills">
          <a href="/" class="nav-link">Extractor</a>
          <a href="/history" class="nav-link">History</a>
          <a href="/automation" class="nav-link">Automation</a>
          <a href="/menu-map" class="nav-link">Menu Map</a>
          <a href="/users" class="nav-link active">Users & Roles</a>
        </nav>
      </div>
      <div class="users-header-actions">
        {% if current_user.is_authenticated %}
        <div class="user-auth-badge">
          <span>Signed in as <strong>{{ current_user.username }}</strong> <small>({{ current_user.role }})</small></span>
          <a href="/logout" title="Log Out">Logout</a>
        </div>
        {% endif %}
        <button class="btn-run" id="addBtn" type="button"><span>Add User</span></button>
      </div>
    </header>

    <div class="users-table-card">
      <table class="modern-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTbody">
          <tr><td colspan="5" style="text-align:center;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
    {% include "_footer.html" %}
  </div>

  <div class="modal-overlay" id="userModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <h3 id="modalTitle" style="margin-top:0; margin-bottom:1.5rem;">Add User</h3>
      <form id="userForm">
        <input type="hidden" id="userId">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password <small id="pwdHint" style="display:none; color:#888;">(leave blank to keep)</small></label>
          <input type="password" class="form-control" id="password">
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select class="form-control" id="role">
            <option value="viewer">Viewer (Read-only)</option>
            <option value="operator">Operator (Can Scrape)</option>
            <option value="admin">Admin (Full Access)</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-save">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/users.js') }}"></script>
</body>
</html>
