<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server Logs - Parts Extractor</title>
  <meta name="description" content="Live server log viewer and single-click log downloads for Parts Extractor." />
  <link rel="icon" href="data:," />
  <script>
    (function () {
      var theme = sessionStorage.getItem('cy_theme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', theme);
      document.documentElement.style.setProperty('--startup-bg', theme === 'light' ? '#f2f4fb' : '#000000');
      document.documentElement.style.setProperty('--startup-text', theme === 'light' ? '#0e1230' : '#e8eaf5');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    :root,
    [data-bs-theme="dark"] {
      --startup-bg: #000000;
      --startup-text: #e8eaf5;
      --startup-card: #000000;
      --startup-border: #252a3d;
    }

    [data-bs-theme="light"] {
      --startup-bg: #f2f4fb;
      --startup-text: #0e1230;
      --startup-card: #ffffff;
      --startup-border: #d0d5ee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box }
    body {
      font-family: var(--font-ui, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
      background: var(--startup-bg);
      color: var(--startup-text);
      min-height: 100vh;
    }
    .page-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: .75rem 1rem;
    }
    .cy-card { background: var(--startup-card); border: 1px solid var(--startup-border); border-radius: 16px; }
    .d-none { display: none !important; }
  </style>
  <link rel="stylesheet" href="{{ asset_url('css/common.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/logs.css') }}">
</head>

<body>
  <div class="page-shell py-3">
    <!-- Header -->
    <header class="app-header cy-card mb-3">
      <div class="header-left">
        <div class="app-logo">PE</div>
        <div class="header-brand">
          <div class="header-title-row">
            <h1 class="app-title">Parts Extractor</h1>
          </div>
          <p class="app-sub">Server health &amp; live logs</p>
        </div>
      </div>
      <nav class="nav-pills" aria-label="Primary navigation">
        <a href="/automation" class="nav-link">Automation</a>
        <a href="/menu-map" class="nav-link">Menu Map</a>
        <a href="/history" class="nav-link">History</a>
        <a href="/logs" class="nav-link active">Server Logs</a>
      </nav>
      <div class="header-right">
        <div class="theme-switch" aria-label="Color theme">
          <span class="theme-label">Light</span>
          <label class="switch-track">
            <input type="checkbox" id="darkMode" aria-label="Toggle dark mode" checked>
            <span class="switch-thumb"></span>
          </label>
          <span class="theme-label">Dark</span>
        </div>
      </div>
    </header>

    <!-- Hero / Header -->
    <section class="cy-card logs-hero mb-3">
      <div class="logs-hero__content">
        <div class="logs-hero__left">
          <h2 class="section-title">Production Server Logs</h2>
          <p class="section-subtitle">Real-time system health, worker processes, and live extraction logs</p>
        </div>
      </div>
    </section>

    <!-- Controls & Filters Toolbar -->
    <section class="cy-card logs-toolbar-card mb-3">
      <div class="logs-controls-grid">
        <div class="logs-control-group">
          <label class="logs-control-label" for="logFileSelect">Target Log File</label>
          <select id="logFileSelect" class="logs-select" aria-label="Target Log File">
            <option value="server.log">server.log (Active)</option>
          </select>
        </div>

        <div class="logs-control-group">
          <label class="logs-control-label" for="logLevelSelect">Level</label>
          <select id="logLevelSelect" class="logs-select" aria-label="Log Level Filter">
            <option value="ALL" selected>All Levels</option>
            <option value="ERROR">Errors (ERROR)</option>
            <option value="WARNING">Warnings (WARN)</option>
            <option value="INFO">Info (INFO)</option>
            <option value="DEBUG">Debug (DEBUG)</option>
          </select>
        </div>

        <div class="logs-control-group logs-control-group--search">
          <label class="logs-control-label" for="logSearchInput">Search Logs</label>
          <div class="logs-search-wrapper">
            <svg class="logs-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="logSearchInput" type="text" class="logs-input" placeholder="Filter by keyword, SKU, error, 403, or target..." aria-label="Search Logs">
          </div>
        </div>

        <div class="logs-control-group logs-control-group--lines">
          <label class="logs-control-label" for="logLinesSelect">Max Lines</label>
          <select id="logLinesSelect" class="logs-select" aria-label="Max Lines">
            <option value="100">100 lines</option>
            <option value="250">250 lines</option>
            <option value="500" selected>500 lines</option>
            <option value="1000">1,000 lines</option>
            <option value="2500">2,500 lines</option>
          </select>
        </div>
      </div>

      <div class="logs-actions-row">
        <div class="logs-actions-left">
          <button id="refreshLogsBtn" class="btn-secondary btn-sm" type="button" title="Refresh logs now">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
            Refresh
          </button>

          <label class="logs-check-control">
            <input type="checkbox" id="autoRefreshToggle">
            <span class="logs-check-box"></span>
            <span>Auto-refresh (4s)</span>
          </label>

          <label class="logs-check-control">
            <input type="checkbox" id="autoScrollToggle" checked>
            <span class="logs-check-box"></span>
            <span>Auto-scroll</span>
          </label>
        </div>

        <div class="logs-actions-right">
          <button id="downloadAllLogsBtn" class="btn-export btn-sm" type="button" title="Download all active and rotated server logs as a zip archive">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download All (.ZIP)
          </button>
          <button id="copyLogsBtn" class="btn-secondary btn-sm" type="button" title="Copy visible lines to clipboard">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="13" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
            </svg>
            Copy Visible
          </button>

          <button id="downloadLogBtn" class="btn-run btn-sm" type="button" title="Download selected log file">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download File
          </button>
        </div>
      </div>
    </section>

    <!-- Browser Terminal Console Card -->
    <section class="logs-terminal-card cy-card">
      <div class="logs-terminal-header">
        <div class="logs-window-controls">
          <span class="logs-win-dot dot-close" title="Terminal window"></span>
          <span class="logs-win-dot dot-min"></span>
          <span class="logs-win-dot dot-expand"></span>
        </div>

        <div class="logs-terminal-tab">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          <span id="statPillFile">server.log</span>
          <span id="liveBadge" class="logs-tab-badge is-paused">PAUSED</span>
        </div>

        <div class="logs-terminal-meta">
          <span class="logs-meta-tag" id="statPillSize">-- KB</span>
          <span class="logs-meta-tag" id="statPillLines">-- lines</span>
          <span class="logs-meta-tag" id="statPillTime">--:--:--</span>
        </div>
      </div>

      <div id="logConsoleBody" class="logs-terminal-body" role="region" aria-label="Server Log Terminal Output">
        <div class="logs-terminal-loading">
          <div class="logs-spinner"></div>
          <span>Connecting to server log stream...</span>
        </div>
      </div>
    </section>

    {% include "_footer.html" %}
  </div>

  <script defer src="{{ asset_url('js/logs.js') }}"></script>
</body>

</html>
